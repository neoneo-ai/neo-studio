name: Publish to Comfy Registry

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

# Registry 发布只要读代码加一个 token，不给写权限
permissions:
  contents: read

# tag push 是唯一自动触发口：release published 会让同一个 tag 再发一次 Registry 包
concurrency:
  group: publish-node
  cancel-in-progress: false

jobs:
  publish-node:
    name: Publish Node to Registry
    # 与 tests.yml 的 plugin 作业同一个理由：ubuntu-latest 已是 Ubuntu 26，
    # setup-python@v5 在这条镜像上装 Python 以 exit 2 收场，v1.6.1 的 Registry 发布就是这么挂的。
    runs-on: ubuntu-24.04
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - name: Install comfy-cli
        run: pip install comfy-cli

      # 插件源码在 studio/：pyproject.toml 与 .comfyignore 都在那一层，
      # 发布必须在那一层跑（仓库根的 pyproject 是桌面端自己的，不发 Python 包）
      - name: Publish plugin
        working-directory: studio
        run: |
          comfy --skip-prompt --no-enable-telemetry env
          comfy node publish --token ${{ secrets.COMFY_REGISTRY_PUBLISH_TOKEN }}