name: Tests

permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [main]

jobs:
  plugin:
    name: Kernel plugin tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      # studio/tests/_comfy_api_bootstrap.py 把同级 ComfyUI 根插进 sys.path 导入真实 comfy_api
      # （_comfy_root 找 <repo 父目录>/ComfyUI/comfy_api/latest），V3 节点用例离了它必炸。
      # actions/checkout 拒绝 workspace 外的 path，只能裸 clone 到同级目录。
      - name: Clone ComfyUI as the sibling root
        run: git clone --depth 1 https://github.com/comfyanonymous/ComfyUI ../ComfyUI

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # studio/tests 的 native-LLM 与 mem_stats 用例会真 import 同级内核的 comfy.sd /
      # comfy.model_management / comfy_api，所以 CI 要补齐内核的导入期依赖：
      # safetensors / einops / tqdm / scipy / transformers / tokenizers / sentencepiece 是
      # comfy.utils、comfy.samplers、comfy.sd1_clip、comfy.text_encoders 的模块作用域导入，
      # comfy-kitchen / comfy-aimdo / psutil 是内核 requirements.txt 里的运行时依赖。
      # xformers / cublas_ops / triton / torch_npu 在源码里是 try/except 守卫的可选后端，不装。
      # laya / pillow-heif / oss2 / huggingface_hub 是插件侧函数内可选导入，缺包时功能自行降级。
      - name: Install test deps
        run: |
          pip install pytest PyYAML openai pypinyin Pillow aiohttp av packaging numpy psutil httpx
          pip install safetensors einops tqdm scipy transformers tokenizers sentencepiece comfy-kitchen comfy-aimdo
          pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision

      - name: pytest studio/tests
        run: python -m pytest -q studio/tests

  frontend:
    name: Frontend golden tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: npm ci
        run: npm ci

      # npm run test:ci 串行跑（--test-concurrency=1）：jsdom 用例吃 CPU，runner 只有 2 核，
      # 并发时带轮询的用例会撞到自己的超时，父用例超时后子用例全被 cancelledByParent。
      # npm test 自带 --test-force-exit：建节点留下的 setInterval 会把 runner 挂在 pending timer 上。
      - name: npm run test:ci
        run: npm run test:ci