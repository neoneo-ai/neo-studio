<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>新影工坊 · Neo Studio</title>
<!-- 各 web/ 模块会自行注入所需 CSS（recipes.css / lightbox.css …）；
     prompts.css 提供 action toast 与 rs-btn 基础样式，这里统一带上 -->
<link rel="stylesheet" href="/extensions/comfyui-neo-studio/prompts.css">
<script type="importmap">
{
    "imports": {
        "/scripts/app.js": "/extensions/comfyui-neo-studio/studio/shim/app.js",
        "/scripts/api.js": "/extensions/comfyui-neo-studio/studio/shim/api.js",
        "/scripts/ui.js": "/extensions/comfyui-neo-studio/studio/shim/ui.js"
    }
}
</script>
<link rel="stylesheet" href="/extensions/comfyui-neo-studio/studio/style.css">
<!-- 落地页与智能体页的 CSS 在这里静态带上：运行时注入（gallery.js 与 agent-panel.js 的 ensureCss）要等
     整个模块图跑完才发起请求，窗口打开那一瞬页面先铺一坨没有样式的 DOM，CSS 到了才落位 -->
<link rel="stylesheet" href="/extensions/comfyui-neo-studio/gallery.css">
<!-- data-neo-agent 是 agent-panel.js 的 ensureCss 认的标记：静态带上后运行时不再补第二份 -->
<link rel="stylesheet" data-neo-agent="1" href="/extensions/comfyui-neo-studio/agent-panel.css">
</head>
<body>
<header class="ns-header">
    <a class="ns-logo" href="#/home" title="返回首页">新影工坊</a>
    <nav class="ns-tabs">
        <a href="#/home" data-tab="home">首页</a>
        <a href="#/gallery" data-tab="gallery">素材</a>
        <a href="#/paint" data-tab="paint">绘画</a>
        <a href="#/video" data-tab="video">视频</a>
        <a href="#/director" data-tab="director">导演</a>
        <a href="#/skills" data-tab="skills">技能</a>
        <a href="#/settings" data-tab="settings">设置</a>
    </nav>
    <span class="ns-comfy-status" id="ns-comfy-status" hidden></span>
    <button class="ns-agent-toggle" id="ns-agent-toggle" type="button" title="智能体" hidden></button>
    <span class="ns-wctl" id="ns-wctl" hidden>
        <button class="ns-wctl-btn" id="ns-win-min" type="button"></button>
        <button class="ns-wctl-btn" id="ns-win-max" type="button"></button>
        <button class="ns-wctl-btn" id="ns-win-fs" type="button"></button>
        <button class="ns-wctl-btn ns-wctl-close" id="ns-win-close" type="button"></button>
    </span>
</header>
<div class="ns-body">
    <main id="ns-view" class="ns-view"></main>
</div>
<script type="module" src="/extensions/comfyui-neo-studio/studio/studio-app.js"></script>
</body>
</html>
